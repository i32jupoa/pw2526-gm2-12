# CONSULTAS ALQUILER
select-findAllAlquileres = SELECT id, idUsuario, descripcion, fechaInicio, fechaFin, idVehiculo, precioTotal FROM Alquiler;
select-findAlquilerById = SELECT id, idUsuario, descripcion, fechaInicio, fechaFin, idVehiculo, precioTotal FROM Alquiler WHERE id=?;
insert-addAlquiler = INSERT INTO Alquiler (id, idUsuario, descripcion, fechaInicio, fechaFin, idVehiculo, precioTotal) VALUES (?, ?, ?, ?, ?, ?, ?);
delete-deleteAlquilerById = DELETE FROM Alquiler WHERE id=?;
update-updateAlquiler = UPDATE Alquiler SET idUsuario=?, descripcion=?, fechaInicio=?, fechaFin=?, idVehiculo=?, precioTotal=? WHERE id=?;

