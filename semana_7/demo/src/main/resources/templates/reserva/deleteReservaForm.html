<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Reserva</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Eliminar Reserva</h1>
<form action="/deleteReserva" method="get">
    <label for="id">ID de la Reserva:</label>
    <input type="number" id="id" name="id" min="1" required>
    <button type="submit">Eliminar Reserva</button>
</form>
<p style="color: red; margin-top: 20px;">
    <strong>Advertencia:</strong> Esta acción eliminará permanentemente la reserva de la base de datos.
</p>
</body>
</html>
