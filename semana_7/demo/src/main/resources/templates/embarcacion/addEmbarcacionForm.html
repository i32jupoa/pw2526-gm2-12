<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir Embarcación</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container text-center">
        <h1>Añadir Embarcación</h1>
        <form method="GET" th:action="@{/addEmbarcacion}" class="form-centered">
            <div class="form-group">
                <label for="matricula">Matrícula:</label>
                <input type="text" id="matricula" name="matricula" required class="form-control">
            </div>
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required class="form-control">
            </div>
            <div class="form-group">
                <label for="tipo">Tipo:</label>
                <select id="tipo" name="tipo" required class="form-control">
                    <option value="VELERO">Velero</option>
                    <option value="YATE">Yate</option>
                    <option value="CATAMARAN">Catamarán</option>
                    <option value="LANCHA">Lancha</option>
                </select>
            </div> 
            <div class="form-group">
                <label for="numPlazas">Número de plazas:</label>
                <input type="number" id="numPlazas" name="numPlazas" required class="form-control">
            </div>
            <div class="form-group">
                <label for="dimensiones">Dimensiones:</label>
                <input type="text" id="dimensiones" name="dimensiones" required class="form-control">
            </div>
            <div class="form-group">
                <label for="dniPatron">DNI del Patrón:</label>
                <input type="text" id="dniPatron" name="dniPatron" class="form-control">
            </div>
            <button type="submit" class="btn">Añadir</button>
        </form>
        <div class="btn-group-inline">
            <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>
        </div>
    </div>
</body>
</html>
