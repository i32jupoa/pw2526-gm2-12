<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error al añadir embarcación</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container text-center">
        <h1>Error al añadir la embarcación</h1>
        <div class="error-box">
            Hubo un problema al intentar guardar la embarcación en la base de datos.
        </div>
        <div class="card card-centered" th:if="${embarcacion != null}">
            <p>Intentaste añadir la embarcación con:</p>
            <p><strong>Matrícula:</strong> <span th:text="${embarcacion.matricula}">NULL</span></p>
            <p><strong>Nombre:</strong> <span th:text="${embarcacion.nombre}">NULL</span></p>
        </div>
        <div class="btn-group-inline">
            <a th:href="@{/addEmbarcacion}" class="btn">Volver a intentar</a>
            <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>
        </div>
    </div>
</body>
</html>
