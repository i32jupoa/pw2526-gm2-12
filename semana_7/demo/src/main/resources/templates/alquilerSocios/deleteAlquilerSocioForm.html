<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Eliminar relación Alquiler-Socio</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Eliminar relación Alquiler-Socio</h1>

<form th:action="@{/deleteAlquilerSocio}" method="get">
    <label for="idAlquiler">ID Alquiler:</label>
    <input type="number" id="idAlquiler" name="idAlquiler" required/><br/><br/>

    <label for="dni">DNI del Socio:</label>
    <input type="text" id="dni" name="dni" required/><br/><br/>

    <button type="submit">Eliminar</button>
</form>

<a href="/">Volver al inicio</a>
</body>
</html>
