<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"

<head>
    <title>Buscar por ID de Alquiler</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Buscar relaciones por ID de Alquiler</h1>

<form th:action="@{/findAlquilerSocioById}" method="get">

</form>

<a href="/">Volver al inicio</a>
</body>
</html>
