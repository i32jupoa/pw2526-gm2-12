<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Alquiler</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>Nuevo Alquiler</h1>
        <form th:action="@{/addAlquiler}" th:object="${alquiler}" method="post">
            <div class="form-group">
                <label>ID Inscripción <span class="required">*</span></label>
                <input type="number" th:field="*{idInscripcion}" required/>
            </div>
            <div class="form-group">
                <label>Matrícula <span class="required">*</span></label>
                <input type="text" th:field="*{matricula}" required/>
            </div>
            <div class="form-group">
                <label>Fecha de inicio <span class="required">*</span></label>
                <input type="date" th:field="*{fechaInicio}" required/>
            </div>
            <div class="form-group">
                <label>Fecha de fin <span class="required">*</span></label>
                <input type="date" th:field="*{fechaFin}" required/>
            </div>
            <div class="form-group">
                <label>Plazas reservadas <span class="required">*</span></label>
                <input type="number" th:field="*{plazasReservadas}" required/>
            </div>
            <div class="form-group">
                <label>Precio total <span class="required">*</span></label>
                <input type="number" step="0.01" th:field="*{precioTotal}" required/>
            </div>
            <div class="btn-group">
                <input type="submit" value="Guardar Alquiler"/>
                <a href="/" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
