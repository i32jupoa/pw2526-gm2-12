<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar Socio-Inscripción</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<h1>Buscar Socio-Inscripción por ID de Inscripción</h1>

<form method="GET" th:action="@{/findSocioInscripcionById}">
    <label for="id">ID de Inscripción:</label>
    <input type="number" id="id" name="id" required>
    <input type="submit" value="Buscar">
</form>

<!-- Mostrar resultados si hay alguno -->
<div th:if="${socioInscripciones != null and !socioInscripciones.isEmpty()}">
    <h2>Resultados:</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID Relación</th>
                <th>ID Inscripción</th>
                <th>DNI Socio</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="relacion : ${socioInscripciones}">
                <td th:text="${relacion.id}">ID</td>
                <td th:text="${relacion.idInscripcion}">Inscripción</td>
                <td th:text="${relacion.dniSocio}">DNI</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Mensaje si no hay resultados y se hizo búsqueda -->
<div th:if="${socioInscripciones == null or socioInscripciones.isEmpty()}">
    <p th:if="${busquedaRealizada}">No se ha encontrado ninguna relación socio-inscripción con ese tipo de inscripcion.</p>
</div>

<br>
<a href="/">Volver al inicio</a>
</body>
</html>
