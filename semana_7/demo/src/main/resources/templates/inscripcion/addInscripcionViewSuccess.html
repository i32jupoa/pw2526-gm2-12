<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción añadida</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container text-center">
        <h1>Inscripción añadida correctamente</h1>
        <div class="success-box">
            La inscripción se ha guardado en la base de datos con éxito.
        </div>
        <div class="card card-centered">
            <h3>Datos de la inscripción</h3>
            <p><strong>ID:</strong> <span th:text="${inscripcion.id}">0</span></p>
            <p><strong>Fecha de creación:</strong> <span th:text="${inscripcion.fechaCreacion}">NULL</span></p>
            <p><strong>Tipo:</strong> <span th:text="${inscripcion.tipo}">NULL</span></p>
            <p><strong>Cuota actual:</strong> <span th:text="${inscripcion.cuotaActual}">NULL</span></p>
            <p><strong>DNI Titular:</strong> <span th:text="${inscripcion.dniTitular}">NULL</span></p>
        </div>
        <div class="btn-group-inline">
            <a th:href="@{/addInscripcionForm}" class="btn">Añadir otra inscripción</a>
            <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>
        </div>
    </div>
</body>
</html>
