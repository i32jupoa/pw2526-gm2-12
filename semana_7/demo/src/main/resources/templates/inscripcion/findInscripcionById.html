<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar Inscripción</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1>Buscar Inscripción por ID</h1>

    <form method="GET" th:action="@{/findInscripcionById}">
        <label for="id">ID de inscripción:</label>
        <input type="number" id="id" name="id" required>
        <input type="submit" value="Buscar">
    </form>

    <div th:if="${inscripcion != null}">
        <h2>Resultado:</h2>
        <p><strong>ID:</strong> <span th:text="${inscripcion.id}">0</span></p>
        <p><strong>Fecha de creación:</strong> <span th:text="${inscripcion.fechaCreacion}">NULL</span></p>
        <p><strong>Tipo:</strong> <span th:text="${inscripcion.tipo}">NULL</span></p>
        <p><strong>Cuota actual:</strong> <span th:text="${inscripcion.cuotaActual}">NULL</span></p>
        <p><strong>DNI Titular:</strong> <span th:text="${inscripcion.dniTitular}">NULL</span></p>
    </div>

    <div th:if="${inscripcion == null}">
        <p style="color: red;" th:text="${error}">No se encontró ninguna inscripción con ese ID.</p>
    </div>

    <br>
    <a href="/">Volver al inicio</a>
</body>
</html>
