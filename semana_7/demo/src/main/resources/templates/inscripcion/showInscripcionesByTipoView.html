<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Resumen de Inscripciones por Tipo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1>Resumen de Inscripciones por Tipo</h1>

    <table border="1">
        <tr>
            <th>Tipo de Inscripción</th>
            <th>Número de Inscripciones</th>
        </tr>
        <tr th:each="resumen : ${resumenTipos}">
            <td th:text="${resumen.tipo}">Tipo</td>
            <td th:text="${resumen.cantidad}">0</td>
        </tr>
    </table>
</body>
</html>
