<!DOCTYPE html>
<html>
<head>
  <title>Consulta de Patrón</title>
</head>
<body>
  <h1>Consulta de Patrón por ID</h1>
  {% if patron %}
  <ul>
    <li><strong>ID:</strong> {{ patron.id }}</li>
    <li><strong>Nombre:</strong> {{ patron.nombre }}</li>
    <li><strong>Email:</strong> {{ patron.email }}</li>
    <li><strong>Teléfono:</strong> {{ patron.telefono }}</li>
  </ul>
  {% else %}
  <p>No se encontró ningún patrón con ese ID.</p>
  {% endif %}
</body>
</html>
