<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Añadir Socio-Inscripción</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Añadir Relación Socio-Inscripción</h1>
    
    <form action="/addSocioInscripcion" method="get">
        <div>
            <label for="idInscripcion">ID de la Inscripción:</label>
            <input type="number" id="idInscripcion" name="idInscripcion" 
                   min="1" required>
        </div>
        
        <div>
            <label for="dniSocio">DNI del Socio:</label>
            <input type="text" id="dniSocio" name="dniSocio" 
                   pattern="[0-9]{8}[A-Za-z]" 
                   placeholder="12345678A" required>
        </div>
        
        <button type="submit">Añadir Relación</button>
        <a href="/">Cancelar</a>
    </form>
</body>
</html>
