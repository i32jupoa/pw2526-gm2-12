<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
<head>
    <title>Alquiler encontrado</title>
    <meta charset="UTF-8">
</head>
<body>
<h1>Alquiler encontrado</h1>

<p><strong>ID:</strong> <span th:text="${alquiler.id}">0</span></p>
<p><strong>ID Usuario:</strong> <span th:text="${alquiler.idUsuario}">0</span></p>
<p><strong>Descripción:</strong> <span th:text="${alquiler.descripcion}">NULL</span></p>
<p><strong>Fecha de inicio:</strong> <span th:text="${alquiler.fechaInicio}">NULL</span></p>
<p><strong>Fecha de fin:</strong> <span th:text="${alquiler.fechaFin}">NULL</span></p>
<p><strong>ID Vehículo:</strong> <span th:text="${alquiler.idVehiculo}">0</span></p>
<p><strong>Precio total:</strong> <span th:text="${alquiler.precioTotal}">0.0</span></p>

<a href="/findAlquilerForm">Buscar otro alquiler</a><br>
<a href="/">Volver al inicio</a>
</body>
</html>
