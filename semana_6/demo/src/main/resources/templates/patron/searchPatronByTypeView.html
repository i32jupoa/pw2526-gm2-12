<!DOCTYPE html>
<html>
<head>
  <title>Consulta de Patrones por Tipo</title>
</head>
<body>
  <h1>Consulta de Patrones por Tipo</h1>
  {% if patrons %}
  <table border="1">
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Tipo</th>
      <th>Email</th>
    </tr>
    {% for patron in patrons %}
    <tr>
      <td>{{ patron.id }}</td>
      <td>{{ patron.nombre }}</td>
      <td>{{ patron.tipo }}</td>
      <td>{{ patron.email }}</td>
    </tr>
    {% endfor %}
  </table>
  {% else %}
  <p>No hay patrones de ese tipo.</p>
  {% endif %}
</body>
</html>
