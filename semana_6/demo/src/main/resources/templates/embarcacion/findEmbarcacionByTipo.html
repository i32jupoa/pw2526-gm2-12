<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar Embarcación por Tipo</title>
</head>
<body>

<h1>Buscar Embarcación por Tipo</h1>

<form method="GET" th:action="@{/findEmbarcacionByTipo}">
    <label for="tipo">Tipo de embarcación:</label>
    <select name="tipo" id="tipo">
        <option value="">-- Seleccione un tipo --</option>
        <option value="VELERO">Velero</option>
        <option value="YATE">Yate</option>
        <option value="CATAMARAN">Catamaran</option>
        <option value="LANCHA">Lancha</option>
    </select>
    <input type="submit" value="Buscar">
</form>

<br/>

<div th:if="${buscado}">

    <div th:if="${embarcaciones != null and !#lists.isEmpty(embarcaciones)}">
        <h2>Resultados encontrados:</h2>

        <table border="1">
            <thead>
                <tr>
                    <th>Matrícula</th>
                    <th>Nombre</th>
                    <th>Tipo</th>
                    <th>Plazas</th>
                    <th>Dimensiones</th>
                    <th>DNI Patrón</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="emb : ${embarcaciones}">
                    <td th:text="${emb.matricula}"></td>
                    <td th:text="${emb.nombre}"></td>
                    <td th:text="${emb.tipo}"></td>
                    <td th:text="${emb.numPlazas}"></td>
                    <td th:text="${emb.dimensiones}"></td>
                    <td th:text="${emb.dniPatron != null ? emb.dniPatron : 'No hay patrón registrado'}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${embarcaciones == null or #lists.isEmpty(embarcaciones)}">
        <p><strong>No se encontraron embarcaciones del tipo seleccionado.</strong></p>
    </div>

</div>

<br/>
<a th:href="@{/}">Volver al inicio</a>

</body>
</html>
