<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar Reserva</title>
</head>
<body>
    <h1>Buscar Reserva</h1>

    <form method="GET" th:action="@{/findReserva}">
        <label for="id">ID de la reserva:</label>
        <input type="number" name="id" required>
        <input type="submit" value="Buscar">
    </form>

    <div th:if="${reserva != null}">
        <h2>Resultado:</h2>
        <p><strong>ID:</strong> <span th:text="${reserva.id}">0</span></p>
        <p><strong>DNI del Patrón:</strong> <span th:text="${reserva.dniPatron}">NULL</span></p>
        <p><strong>Matrícula de la embarcación:</strong> <span th:text="${reserva.matriculaEmbarcacion}">NULL</span></p>
        <p><strong>Fecha de reserva:</strong> <span th:text="${reserva.fechaReserva}">NULL</span></p>
        <p><strong>Duración (días):</strong> <span th:text="${reserva.duracionDias}">0</span></p>
        <p><strong>Descripción:</strong> <span th:text="${reserva.descripcion}">NULL</span></p>
        <p><strong>Precio total:</strong> <span th:text="${reserva.precioTotal}">0.0</span></p>
    </div>

    <div th:if="${reserva == null}">
        <p>No se encontró ninguna reserva con ese ID.</p>
    </div>

    <a href="/">Volver al inicio</a>
</body>
</html>
