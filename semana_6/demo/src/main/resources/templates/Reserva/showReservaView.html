<!DOCTYPE html>
<html>
<head>
  <title>Listado de Reservas</title>
</head>
<body>
  <h1>Listado de Reservas</h1>
  {% if reservas %}
  <table border="1">
    <tr>
      <th>ID</th>
      <th>Fecha</th>
      <th>Patrón</th>
      <th>Detalles</th>
    </tr>
    {% for reserva in reservas %}
    <tr>
      <td>{{ reserva.id }}</td>
      <td>{{ reserva.fecha }}</td>
      <td>{{ reserva.patron.nombre }}</td>
      <td>{{ reserva.detalles }}</td>
    </tr>
    {% endfor %}
  </table>
  {% else %}
  <p>No hay reservas registradas.</p>
  {% endif %}
</body>
</html>
