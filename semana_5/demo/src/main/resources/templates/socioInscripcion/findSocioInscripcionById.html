<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar Socio-Inscripción</title>
</head>
<body>
    <h1>Buscar Socio-Inscripción por ID</h1>

    <form method="GET" th:action="@{/findSocioInscripcionById}">
        <label for="id">ID de la relación:</label>
        <input type="number" name="id" required>
        <input type="submit" value="Buscar">
    </form>

    <div th:if="${socioInscripcion != null}">
        <h2>Resultado:</h2>
        <p><strong>ID:</strong> <span th:text="${socioInscripcion.id}">0</span></p>
        <p><strong>ID Inscripción:</strong> <span th:text="${socioInscripcion.idInscripcion}">NULL</span></p>
        <p><strong>DNI Socio:</strong> <span th:text="${socioInscripcion.dniSocio}">NULL</span></p>
    </div>

    <div th:if="${socioInscripcion == null}">
        <p>No se ha encontrado ninguna relación socio-inscripción con ese ID.</p>
    </div>

    <a href="/">Volver al inicio</a>
</body>
</html>
