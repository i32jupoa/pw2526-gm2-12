<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar Embarcación por Matrícula</title>
</head>
<body>
<h1>Buscar Embarcación por Matrícula</h1>

<form method="GET" th:action="@{/findEmbarcacionByMatricula}">
    <label for="matricula">Matrícula:</label>
    <input type="text" id="matricula" name="matricula" required/>
    <input type="submit" value="Buscar"/>
</form>

<div th:if="${embarcacion != null}">
    <h2>Resultado:</h2>
    <table border="1">
        <tr>
            <th>Matrícula</th>
            <th>Nombre</th>
            <th>Tipo</th>
            <th>Número de plazas</th>
            <th>Dimensiones</th>
            <th>DNI Patrón</th>
        </tr>
        <tr>
            <td th:text="${embarcacion.matricula}">MATRICULA</td>
            <td th:text="${embarcacion.nombre}">NOMBRE</td>
            <td th:text="${embarcacion.tipo}">TIPO</td>
            <td th:text="${embarcacion.numPlazas}">0</td>
            <td th:text="${embarcacion.dimensiones}">DIMENSIONES</td>
            <td th:text="${embarcacion.dniPatron}">DNI</td>
        </tr>
    </table>
</div>

<div th:if="${embarcacion == null}">
    <p>No se encontró ninguna embarcación con esa matrícula.</p>
</div>

<a th:href="@{/}">Volver al inicio</a>
</body>
</html>
