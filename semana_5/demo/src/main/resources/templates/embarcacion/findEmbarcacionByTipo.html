<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar Embarcaciones por Tipo</title>
</head>
<body>
<h1>Buscar Embarcaciones por Tipo</h1>

<form method="GET" th:action="@{/findEmbarcacionesByTipo}">
    <label for="tipo">Tipo de embarcación:</label>
    <select name="tipo">
        <option value="VELERO">Velero</option>
        <option value="YATE">Yate</option>
        <option value="PESQUERO">Pesquero</option>
        <option value="LANCHA">Lancha</option>
    </select>
    <input type="submit" value="Buscar">
</form>

<div th:if="${embarcaciones != null}">
    <h2>Resultados:</h2>
    <table border="1">
        <tr>
            <th>Matrícula</th>
            <th>Nombre</th>
            <th>Tipo</th>
            <th>Número de plazas</th>
            <th>Dimensiones</th>
            <th>DNI Patrón</th>
        </tr>
        <tr th:each="embarcacion : ${embarcaciones}">
            <td th:text="${embarcacion.matricula}">NULL</td>
            <td th:text="${embarcacion.nombre}">NULL</td>
            <td th:text="${embarcacion.tipo}">NULL</td>
            <td th:text="${embarcacion.numPlazas}">0</td>
            <td th:text="${embarcacion.dimensiones}">NULL</td>
            <td th:text="${embarcacion.dniPatron}">NULL</td>
        </tr>
    </table>
</div>

<div th:if="${embarcaciones == null or #lists.isEmpty(embarcaciones)}">
    <p>No se encontraron embarcaciones del tipo seleccionado.</p>
</div>

<a th:href="@{/}">Volver al inicio</a>
</body>
</html>
