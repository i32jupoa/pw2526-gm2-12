<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Embarcación Añadida</title>
</head>
<body>
<h1>Embarcación añadida correctamente</h1>

<table border="1">
    <tr>
        <th>Matrícula</th>
        <th>Nombre</th>
        <th>Tipo</th>
        <th>Número de plazas</th>
        <th>Dimensiones</th>
        <th>DNI Patrón</th>
    </tr>
    <tr>
        <td th:text="${embarcacion.matricula}">MATRICULA</td>
        <td th:text="${embarcacion.nombre}">NOMBRE</td>
        <td th:text="${embarcacion.tipo}">TIPO</td>
        <td th:text="${embarcacion.numPlazas}">0</td>
        <td th:text="${embarcacion.dimensiones}">DIMENSIONES</td>
        <td th:text="${embarcacion.dniPatron}">DNI</td>
    </tr>
</table>

<a th:href="@{/}">Volver al inicio</a>
</body>
</html>
