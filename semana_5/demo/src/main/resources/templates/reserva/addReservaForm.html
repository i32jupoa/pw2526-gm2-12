<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Añadir Reserva</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Añadir Nueva Reserva</h1>
    
    <form action="/addReserva" method="get">
        <div>
            <label for="id">ID de la Reserva:</label>
            <input type="number" id="id" name="id" 
                   min="1" required>
        </div>
        
        <div>
            <label for="dniSocio">DNI del Socio:</label>
            <input type="text" id="dniSocio" name="dniSocio" 
                   pattern="[0-9]{8}[A-Za-z]" 
                   placeholder="12345678A" required>
        </div>
        
        <div>
            <label for="matricula">Matrícula de la Embarcación:</label>
            <input type="text" id="matricula" name="matricula" 
                   placeholder="ABC123" required>
        </div>
        
        <div>
            <label for="fecha">Fecha de Reserva:</label>
            <input type="date" id="fecha" name="fecha" required>
        </div>
        
        <div>
            <label for="plazasReservadas">Plazas Reservadas:</label>
            <input type="number" id="plazasReservadas" name="plazasReservadas" 
                   min="1" required>
        </div>
        
        <div>
            <label for="proposito">Propósito:</label>
            <textarea id="proposito" name="proposito" 
                      rows="3" placeholder="Excursión familiar" required></textarea>
        </div>
        
        <div>
            <label for="precioTotal">Precio Total (€):</label>
            <input type="number" id="precioTotal" name="precioTotal" 
                   step="0.01" min="0" required>
        </div>
        
        <button type="submit">Añadir Reserva</button>
        <a href="/">Cancelar</a>
    </form>
</body>
</html>
